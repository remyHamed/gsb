stages:
  - test
  - build

variables:
  PHP_VERSION: "8.4"
  POSTGRES_DB: "test_db"
  POSTGRES_USER: "test_user"
  POSTGRES_PASSWORD: "test_password"
  DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?serverVersion=15&charset=utf8"

services:
  - name: postgres:15-alpine
    alias: postgres

php-tests:
  stage: test
  image: php:${PHP_VERSION}-cli-alpine
  before_script:
    - apk add --no-cache git libpq-dev postgresql-client
    - docker-php-ext-install pdo pdo_pgsql
    - curl -sS https://getcomposer.org | php -- --install-dir=/usr/local/bin --filename=composer
  script:
    - composer install --prefer-dist --no-ansi --no-interaction --no-progress
    - php bin/console doctrine:database:create --env=test || true
    - php bin/console doctrine:migrations:migrate --no-interaction --env=test
    - php bin/phpunit

docker-build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_DRIVER: overlay2
  script:
    - docker build --target prod -t gsb-app:$CI_COMMIT_SHA .