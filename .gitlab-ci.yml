stages:
  - check
  - test
  - build

.php-base:
  image: php:8.4-cli
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git unzip libicu-dev libpq-dev libzip-dev
    - docker-php-ext-install intl pdo_pgsql zip
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer

php-check:
  extends: .php-base
  stage: check
  variables:
    APP_ENV: prod
    DATABASE_URL: "postgresql://user:pass@localhost:5432/db?serverVersion=16&charset=utf8"
  script:
    - composer install --prefer-dist --no-ansi --no-interaction --no-progress
    - php bin/console lint:container
    - php bin/console lint:yaml config

phpunit:
  extends: .php-base
  stage: test
  services:
    - postgres:16
  variables:
    APP_ENV: test
    POSTGRES_DB: app
    POSTGRES_USER: app
    POSTGRES_PASSWORD: app
    DATABASE_URL: "postgresql://app:app@postgres:5432/app?serverVersion=16&charset=utf8"
    JWT_PASSPHRASE: ci-passphrase
  before_script:
    - !reference [.php-base, before_script]
    - composer install --prefer-dist --no-ansi --no-interaction --no-progress
    - php bin/console lexik:jwt:generate-keypair --overwrite --no-interaction
    - php bin/console doctrine:database:create --if-not-exists --no-interaction
    - php bin/console doctrine:migrations:migrate --no-interaction
  script:
    - php bin/phpunit --testdox

docker-build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build --target prod -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"