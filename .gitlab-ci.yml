stages:
  - check
  - build

php-check:
  stage: check
  image: php:8.4-cli
  variables:
    APP_ENV: prod
    DATABASE_URL: "postgresql://user:pass@localhost:5432/db?serverVersion=15&charset=utf8"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git unzip libicu-dev libpq-dev libzip-dev
    - docker-php-ext-install intl pdo_pgsql zip
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
  script:
    - composer install --prefer-dist --no-ansi --no-interaction --no-progress
    - php bin/console lint:container
    - php bin/console lint:yaml config

docker-build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build --target prod -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"